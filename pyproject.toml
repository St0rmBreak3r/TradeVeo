[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tryedveo"
version = "0.1.0"
description = "Local-first trading journal and analytics"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "python-multipart>=0.0.20,<0.1",
  "uvicorn[standard]>=0.34,<1.0",
  "pydantic>=2.10,<3.0",
  "sqlalchemy>=2.0,<3.0",
  "alembic>=1.14,<2.0",
  "tzlocal>=5.2,<7.0",
  "openai>=2.0,<3.0",
  "anthropic>=0.109,<1.0",
  "ollama>=0.6,<1.0",
  "httpx>=0.27,<1.0",
  "Pillow>=11.0,<13.0",
  "keyring>=25.5,<27.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10.0",
  "httpx>=0.27,<1.0",
]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
addopts = "-ra"
