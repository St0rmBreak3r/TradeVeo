<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f5f1" />
    <meta name="description" content="Tradeveo — upload a chart screenshot and get a veteran trader's entry setup." />
    <script>
      try {
        const theme = localStorage.getItem('tradeveo-theme');
        document.documentElement.dataset.theme = theme === 'dark' ? 'dark' : 'light';
        document.documentElement.style.colorScheme = theme === 'dark' ? 'dark' : 'light';
      } catch {
        document.documentElement.dataset.theme = 'light';
        document.documentElement.style.colorScheme = 'light';
      }
    </script>
    <title>Tradeveo — Chart setups</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/frontend/src/main.tsx"></script>
  </body>
</html>
